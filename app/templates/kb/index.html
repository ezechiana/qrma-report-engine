<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} | Go360 Knowledge Base</title><style>
:root{--navy:#0d2745;--navy2:#153f69;--ink:#192634;--muted:#657587;--line:#dbe4ec;--soft:#f2f7fa;--paper:#fff;--gold:#d0ad63;--blue:#2563a6;--max:1120px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#eef3f7;line-height:1.5}
a{color:inherit}.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}.topin,.wrap{width:min(calc(100% - 32px),var(--max));margin:auto}.topin{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;text-decoration:none}.brand span{font-weight:500;opacity:.7}.nav{display:flex;gap:18px}.nav a{font-size:.86rem;text-decoration:none;opacity:.82}
.page{padding:34px 0 70px}.crumbs{font-size:.84rem;color:var(--muted);margin-bottom:18px}.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(15,39,66,.05)}

h1{color:var(--navy);margin:0 0 6px}.desc{color:var(--muted);margin:0 0 24px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:11px}.item{padding:14px;text-decoration:none}.item:hover{border-color:#9bb8d2}.id{font-size:.76rem;color:var(--muted)}.title{font-weight:800;color:var(--navy);margin:3px 0}.qrma{font-size:.83rem;color:var(--muted)}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="/kb/">Go360 <span>Knowledge Base</span></a><nav class="nav"><a href="/kb/search">Search</a><a href="/kb/a-z">A–Z</a></nav></div></header>
<main class="wrap page"><div class="crumbs"><a href="/kb/">Knowledge Base</a> › {{ title }}</div><h1>{{ title }}</h1><p class="desc">{{ description }}</p><div class="list">
{% for marker in markers %}<a class="card item" href="/kb/{{ marker.go360_id }}"><div class="id">{{ marker.go360_id }}</div><div class="title">{{ marker.go360_title }}</div>{% if marker.qrma_term is defined %}<div class="qrma">QRMA: {{ marker.qrma_term }}</div>{% endif %}</a>{% endfor %}
</div></main></body></html>
