<!DOCTYPE html>
<html lang="en">
<head>
    {% include "shared/brand_head.html" %}
    <title>Your report · go360</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        {% include "shared/public_card_styles.html" %}
        #report-card { width: min(100%, 640px); }
        #report-card article strong { display: block; margin: 2px 0; }
    </style>
</head>
<body>
<main class="public-page">
    {% set portal_section = "records" %}
    {% include "shared/client_portal_header.html" %}
    <section class="card" id="report-card">
        <p class="muted">Loading your report…</p>
    </section>
</main>
<script>
    const card = document.getElementById("report-card");

    function pathParts() {
        return window.location.pathname.split("/").filter(Boolean);
    }

    function recordId() {
        const parts = pathParts();
        if (parts[0] !== "client" || parts[1] !== "records" || !parts[2]) return "";
        try {
            return decodeURIComponent(parts[2]);
        } catch (err) {
            return "";
        }
    }

    function reportId() {
        const parts = pathParts();
        if (parts[3] !== "reports" || !parts[4]) return "";
        try {
            return decodeURIComponent(parts[4]);
        } catch (err) {
            return "";
        }
    }

    function add(parent, tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        parent.appendChild(node);
        return node;
    }

    function showMessage(text, isError) {
        card.textContent = "";
        add(card, "p", isError ? "error" : "muted", text);
    }

    function textOf(value) {
        if (typeof value !== "string") return "";
        return value.trim();
    }

    function renderReport(data) {
        card.textContent = "";
        const back = add(card, "a", "text-link", "Back to your record");
        back.href = "/client/records/" + encodeURIComponent(recordId());
        add(card, "h1", "", textOf(data.label) || "Your report");
        const kind = textOf(data.report_type) === "trend" ? "Trend report" : "Assessment report";
        add(card, "p", "muted", kind);
        const summary = textOf(data.summary);
        if (summary) add(card, "p", "", summary);
        (Array.isArray(data.sections) ? data.sections : []).forEach((section) => {
            const title = textOf(section && section.title);
            const body = textOf(section && section.body);
            if (!title && !body) return;
            const article = add(card, "article");
            if (title) add(article, "strong", "", title);
            if (body) add(article, "p", "", body);
        });
        if (!summary && !(Array.isArray(data.sections) && data.sections.length)) {
            add(card, "p", "muted", "Your clinic has released this report. A written summary is not available yet.");
        }
    }

    async function loadReport() {
        const patientId = recordId();
        const openedId = reportId();
        if (!patientId || !openedId) {
            showMessage("Report not found.", true);
            return;
        }
        try {
            const me = await fetch("/auth/me", { credentials: "same-origin" });
            if (me.status === 401) {
                window.location.href = "/login";
                return;
            }
            if (me.ok) {
                const meData = await me.json().catch(() => ({}));
                const user = meData.user || {};
                const role = String(user.role || "").toLowerCase();
                if (role && role !== "client") {
                    window.location.href = "/app";
                    return;
                }
                if (role === "client" && !user.email_verified_at) {
                    window.location.href = "/login";
                    return;
                }
            }

            const response = await fetch(
                "/api/client/records/" + encodeURIComponent(patientId) + "/reports/" + encodeURIComponent(openedId),
                { credentials: "same-origin" }
            );
            const data = await response.json().catch(() => ({}));
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            if (response.status === 403) {
                const detail = String(data.detail || "");
                window.location.href = detail.toLowerCase().includes("verify") ? "/login" : "/app";
                return;
            }
            if (response.status === 404) {
                showMessage("Report not found.", true);
                return;
            }
            if (!response.ok) {
                showMessage("Could not load your report.", true);
                return;
            }
            renderReport(data);
        } catch (err) {
            showMessage("Could not load your report.", true);
        }
    }

    loadReport();
</script>
</body>
</html>
